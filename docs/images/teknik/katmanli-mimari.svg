<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f4fd"/>
      <stop offset="100%" stop-color="#cfe8fa"/>
    </linearGradient>
    <linearGradient id="apiGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#ffe0b2"/>
    </linearGradient>
    <linearGradient id="bizGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8f5e9"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <linearGradient id="daGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f3e5f5"/>
      <stop offset="100%" stop-color="#e1bee7"/>
    </linearGradient>
    <linearGradient id="entGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#cfd8dc"/>
    </linearGradient>
    <linearGradient id="infraGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="100%" stop-color="#ffecb3"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#546e7a"/>
    </marker>
    <filter id="shadow" x="-2%" y="-2%" width="104%" height="104%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <rect width="920" height="640" fill="#fafbfc"/>

  <text x="460" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#263238">CeyPASS Katmanli Mimari</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#607d8b">Istemciler, API ve paylasilan katmanlar</text>

  <g filter="url(#shadow)">
    <rect x="40" y="80" width="640" height="88" rx="10" fill="url(#uiGrad)" stroke="#0288d1" stroke-width="2"/>
    <text x="60" y="104" font-size="14" font-weight="700" fill="#01579b">UI Katmani</text>
    <rect x="60" y="114" width="130" height="40" rx="6" fill="#ffffff" stroke="#0288d1"/>
    <text x="125" y="139" text-anchor="middle" font-size="13" fill="#0277bd">CeyPASS.Web</text>
    <rect x="205" y="114" width="130" height="40" rx="6" fill="#ffffff" stroke="#0288d1"/>
    <text x="270" y="139" text-anchor="middle" font-size="13" fill="#0277bd">CeyPASS.WFA</text>
    <rect x="350" y="114" width="130" height="40" rx="6" fill="#ffffff" stroke="#0288d1"/>
    <text x="415" y="139" text-anchor="middle" font-size="13" fill="#0277bd">CeyPASS.WPF</text>
    <rect x="495" y="114" width="165" height="40" rx="6" fill="#ffffff" stroke="#0288d1"/>
    <text x="577" y="139" text-anchor="middle" font-size="13" fill="#0277bd">CeyPASS.Mobile</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="710" y="114" width="170" height="88" rx="10" fill="url(#apiGrad)" stroke="#f57c00" stroke-width="2"/>
    <text x="795" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#e65100">CeyPASS.Api</text>
    <text x="795" y="162" text-anchor="middle" font-size="12" fill="#ef6c00">REST + JWT</text>
    <text x="795" y="182" text-anchor="middle" font-size="11" fill="#bf360c">api/v1</text>
  </g>

  <line x1="125" y1="168" x2="125" y2="210" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="168" x2="270" y2="210" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="415" y1="168" x2="415" y2="210" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 577 154 L 660 154 L 660 158 L 710 158" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="795" y1="202" x2="795" y2="240" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 795 240 L 795 260 L 460 260 L 460 280" fill="none" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="200" y="198" font-size="11" fill="#78909c">Dogrudan Business</text>
  <text x="620" y="148" font-size="11" fill="#78909c">HTTP</text>

  <g filter="url(#shadow)">
    <rect x="40" y="280" width="840" height="72" rx="10" fill="url(#bizGrad)" stroke="#388e3c" stroke-width="2"/>
    <text x="460" y="308" text-anchor="middle" font-size="15" font-weight="700" fill="#1b5e20">CeyPASS.Business</text>
    <text x="460" y="330" text-anchor="middle" font-size="12" fill="#2e7d32">Servisler, is kurallari, yetkilendirme</text>
  </g>

  <line x1="460" y1="352" x2="460" y2="388" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="388" width="840" height="72" rx="10" fill="url(#daGrad)" stroke="#7b1fa2" stroke-width="2"/>
    <text x="460" y="416" text-anchor="middle" font-size="15" font-weight="700" fill="#4a148c">CeyPASS.DataAccess</text>
    <text x="460" y="438" text-anchor="middle" font-size="12" fill="#6a1b9a">EF Core DbContext, Repository</text>
  </g>

  <line x1="460" y1="460" x2="460" y2="496" stroke="#546e7a" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="40" y="496" width="840" height="72" rx="10" fill="url(#entGrad)" stroke="#455a64" stroke-width="2"/>
    <text x="460" y="524" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">CeyPASS.Entities</text>
    <text x="460" y="546" text-anchor="middle" font-size="12" fill="#37474f">Modeller, DTO, enum (DB bagimsiz sozlesme)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="40" y="592" width="840" height="36" rx="8" fill="url(#infraGrad)" stroke="#ffa000" stroke-width="1.5"/>
    <text x="460" y="615" text-anchor="middle" font-size="13" font-weight="600" fill="#ff6f00">CeyPASS.Infrastructure - Mail, sifreleme, DatabaseHelperCore</text>
  </g>

  <ellipse cx="860" cy="424" rx="28" ry="20" fill="#ffffff" stroke="#7b1fa2" stroke-width="1.5"/>
  <text x="860" y="429" text-anchor="middle" font-size="11" fill="#6a1b9a">SQL</text>
  <line x1="878" y1="410" x2="878" y2="438" stroke="#7b1fa2" stroke-width="1.5"/>
</svg>
