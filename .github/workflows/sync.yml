name: Sync from Private Company Repo

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Clone company repo
        run: |
          git clone --branch main https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/ceysoft/ceypass.git repo

      - name: Remove company github folder
        run: |
          rm -rf repo/.github
          mkdir -p repo/.github/workflows
          cat > repo/.github/workflows/sync.yml << 'SYNCEOF'
