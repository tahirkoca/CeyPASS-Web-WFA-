name: Sync from Private Company Repo

on:
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: personal

      - name: Clone company repo
        run: |
          git clone --branch main https://x-access-token:${{ secrets.PERSONAL_TOKEN }}@github.com/ceysoft/ceypass.git company

      - name: Sync files
        run: |
          rsync -av --exclude='.github' --exclude='.git' company/ personal/
          cd personal
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add -A
          git commit -m "Sync from company repo" || echo "Nothing to commit"
          git push
