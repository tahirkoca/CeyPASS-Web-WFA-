# CeyPASS WFA CI/CD: Build -> Zip (net8.0-windows içeriği) -> update.xml -> Sunucuya kopyala
# Runner: Self-hosted (CeyPASS-Local-Server, label: cey-deploy)
# Sürüm: CeyPASS.WFA/Properties/AssemblyInfo.cs içindeki AssemblyVersion kullanılır (manuel güncelleme)

name: WFA Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'CeyPASS.WFA/**'
      - 'CeyPASS.Entities/**'
      - 'CeyPASS.DataAccess/**'
      - 'CeyPASS.Business/**'
      - 'CeyPASS.Infrastructure/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  UPDATE_BASE_URL: 'http://192.168.0.23/CeyPASS-Updates'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cey-deploy ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          $content = Get-Content 'CeyPASS.WFA\Properties\AssemblyInfo.cs' -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            Write-Host "Version=$ver"
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
            "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "AssemblyVersion bulunamadı."
            exit 1
          }

      - name: Build Release
        run: dotnet build CeyPASS.sln -c Release --no-incremental

      - name: Zip (net8.0-windows içeriği, kökte exe/dll)
        id: zip
        shell: powershell
        run: |
          $version = $env:VERSION
          $src = "CeyPASS.WFA\bin\Release\net8.0-windows"
          $zipName = "CeyPASS.WFA.$version.zip"
          if (-not (Test-Path $src)) {
            Write-Error "Build çıktısı bulunamadı: $src"
            exit 1
          }
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          if (-not (Test-Path $zipName)) {
            Write-Error "Zip oluşturulamadı."
            exit 1
          }
          Write-Host "zip_name=$zipName"
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml oluştur
        shell: powershell
        run: |
          $version = $env:VERSION
          $zipName = "${{ steps.zip.outputs.zip_name }}"
          $url = "${{ env.UPDATE_BASE_URL }}/$zipName"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$version</version><url>$url</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8

      - name: Sunucuya kopyala (zip + update.xml)
        shell: powershell
        env:
          # Repo Secrets'ta DEPLOY_PATH tanımlıysa kullanılır; yoksa varsayılan.
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          $dest = if ($env:DEPLOY_PATH) { $env:DEPLOY_PATH } else { 'C:\CeyPASS-Updates' }
          if (-not (Test-Path $dest)) {
            New-Item -ItemType Directory -Path $dest -Force
          }
          Copy-Item -Path "CeyPASS.WFA.$env:VERSION.zip" -Destination $dest -Force
          Copy-Item -Path "update.xml" -Destination $dest -Force
          Write-Host "Kopyalandı: $dest"
