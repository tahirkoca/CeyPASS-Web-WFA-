name: WFA Build and Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'CeyPASS.WFA/**'
      - 'CeyPASS.Entities/**'
      - 'CeyPASS.DataAccess/**'
      - 'CeyPASS.Business/**'
      - 'CeyPASS.Infrastructure/**'
      - '.github/workflows/ci-cd.yml'
  workflow_dispatch:

env:
  UPDATE_BASE_URL: 'https://github.com/ceysoft/ceypass/releases/latest/download'

jobs:
  build-and-deploy:
    runs-on: [ self-hosted, cey-deploy ]
    permissions:
      contents: write # Release oluşturabilmek için bu yetki şart
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: AssemblyInfo'dan sürüm oku
        id: version
        shell: powershell
        run: |
          $content = Get-Content 'CeyPASS.WFA\Properties\AssemblyInfo.cs' -Raw
          if ($content -match 'AssemblyVersion\("([^"]+)"\)') {
            $ver = $Matches[1]
            Write-Host "Version=$ver"
            "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append
            "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Error "AssemblyVersion bulunamadı."
            exit 1
          }

      - name: Build Release
        run: dotnet build CeyPASS.sln -c Release --no-incremental

      - name: Zip Oluştur
        id: zip
        shell: powershell
        run: |
          $version = $env:VERSION
          $src = "CeyPASS.WFA\bin\Release\net8.0-windows"
          $zipName = "CeyPASS.WFA.$version.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $zipName -Force
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT

      - name: update.xml oluştur
        shell: powershell
        run: |
          $version = $env:VERSION
          $zipName = "${{ steps.zip.outputs.zip_name }}"
          $url = "${{ env.UPDATE_BASE_URL }}/$zipName"
          $xml = "<?xml version=`"1.0`" encoding=`"UTF-8`"?><item><version>$version</version><url>$url</url><mandatory>false</mandatory></item>"
          Set-Content -Path "update.xml" -Value $xml -Encoding UTF8

      - name: GitHub Release Oluştur ve Dosyaları Yükle
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.zip.outputs.zip_name }}
            update.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}